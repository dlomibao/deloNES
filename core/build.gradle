[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = [ "src/main/resources" ]
sourceSets.test.java.srcDirs = [ "test/" ]
// Test resources: the pre-existing default dir (src/test/resources —
// nestest.log lives there) PLUS test/resources/, where golden images for
// the harness screen assertions live (headless-harness plan, Phase C2:
// test/resources/golden/ — free content only, never commercial-ROM
// imagery, D12).
sourceSets.test.resources.srcDirs = [ "src/test/resources", "test/resources" ]

// Harness fixtures tier (docs/headless-harness-plan.md, D1/A0): JVM-only
// helpers (javax.imageio, java.nio.file, opentest4j skip support) shared by
// core tests AND desktop tests via testFixtures(project(":core")). Never on
// the html/TeaVM classpath — TeaVM-hostile code stays structurally out of
// core/src. Non-Maven layout, matching src/ + test/ above.
apply plugin: "java-test-fixtures"
sourceSets.testFixtures.java.srcDirs = [ "testFixtures/" ]

dependencies {
    // Match core's Lombok/log4j versions (root build.gradle project(":core") block).
    testFixturesCompileOnly 'org.projectlombok:lombok:1.18.42'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testFixturesImplementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    // D8: opentest4j is the fixtures tier's ONLY test-framework dependency —
    // TestAbortedException gives skip-if-absent without a JUnit type in the
    // API. 1.3.0 is the version bundled with JUnit 5.11.4.
    testFixturesApi 'org.opentest4j:opentest4j:1.3.0'
}

// JaCoCo coverage — Phase A0 of docs/mapper-plan.md. Gate enforces
// ≥90% line coverage on the rom.mapper package so every mapper added
// in Phase B-E has to ship with real tests, not a stub. Threshold can
// be relaxed per-class via includes if a specific class is justifiably
// hard to cover (e.g. defensive branches).
apply plugin: "jacoco"

jacoco {
    // 0.8.14 is the first release with official JDK 25 (class file
    // major v69) support. Earlier 0.8.13 only has experimental support.
    toolVersion = "0.8.14"
}

test {
    finalizedBy jacocoTestReport
    // Forward the golden-image regeneration flag into the test JVM
    // (headless-harness plan, Phase C2 / risk register):
    //   ./gradlew core:test --tests "*NestestGoldenTest" -DregenGolden=true
    if (System.getProperty("regenGolden") != null) {
        systemProperty "regenGolden", System.getProperty("regenGolden")
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = "CLASS"
            includes = [
                "net.lomibao.nes.rom.mapper.*"
            ]
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

eclipse.project.name = appName + "-core"
