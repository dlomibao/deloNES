apply plugin: "java-library"
apply plugin: "war"
apply plugin: "org.gretty"
apply plugin: "org.teavm"

// TeaVM configuration
teavm.js {
    addedToWebApp = true
    mainClass = "net.lomibao.nes.client.HtmlLauncher"
    targetFileName = "classes.js"
}

gretty {
    contextPath = "/"
    httpPort = 8080
}

// Task to run nestest.nes with TeaVM/HTML backend  
tasks.register('runNestestHtml') {
    group = 'emulator'
    description = 'Runs nestest.nes ROM using TeaVM/HTML backend'
    
    dependsOn 'generateJavaScript'
    
    doFirst {
        println "Starting TeaVM application for Nestest..."
        println "Compiling Java to JavaScript with TeaVM..."
    }
    
    doLast {
        println "✅ JavaScript generated successfully at: html/build/generated/teavm/js/classes.js"
        println ""
        println "To test the application:"
        println "1. Copy html/webapp/index.html to html/build/generated/teavm/js/"
        println "2. Extract gdx-teavm runtime files (gdx.wasm.js, howler.js)"
        println "3. Serve the html/build/generated/teavm/js/ directory with any web server"
        println ""
        println "Note: The application needs to be served from a web server (not file://)"
    }
}

// Extract gdx-teavm runtime files after JavaScript generation
tasks.named('generateJavaScript').configure {
    doLast {
        def scriptDir = file("${buildDir}/generated/teavm/js/scripts")
        scriptDir.mkdirs()
        
        // Extract required runtime files from gdx-teavm backend JAR
        configurations.runtimeClasspath.each { file ->
            if (file.name.contains('backend-teavm')) {
                copy {
                    from zipTree(file)
                    into scriptDir
                    include 'gdx.wasm.js'
                    include 'howler.js'
                }
            }
        }
        
        // Copy assets to the output directory
        def jsDir = file("${buildDir}/generated/teavm/js")
        copy {
            from "${project.rootDir}/assets"
            into jsDir
        }
    }
}

// Task to build Nestest HTML application for production
tasks.register('buildNestestHtml') {
    group = 'emulator'
    description = 'Builds optimized production version of Nestest for TeaVM/HTML'
    
    dependsOn 'generateJavaScript', 'prepareWebapp'
    
    doFirst {
        println "Building optimized TeaVM application for Nestest..."
        // Switch to production settings
        teavm.minifying = true
        teavm.optimizationLevel = "FULL"
    }
    
    doLast {
        println "Build complete! Output in html/build/dist/"
    }
}

// Copy webapp resources to build directory
tasks.register('prepareWebapp', Copy) {
    from 'webapp'
    into 'build/dist/webapp'
    
    doLast {
        // Update index.html to reference TeaVM generated files
        def indexFile = file('build/dist/webapp/index.html')
        if (indexFile.exists()) {
            def content = indexFile.text
            // Replace GWT script reference with TeaVM
            content = content.replaceAll('html/html\\.nocache\\.js', 'classes.js')
            indexFile.text = content
        }
    }
}

tasks.register('dist') {
    dependsOn 'buildNestestHtml'
    doLast {
        println "Distribution built successfully!"
    }
}

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11
sourceSets.main.java.srcDirs = [ "src/" ]

eclipse.project.name = appName + "-html"
