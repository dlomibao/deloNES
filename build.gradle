buildscript {
    

    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
        maven { url "https://jitpack.io" }
        maven { 
            url "http://teavm.org/maven/repository/"
            allowInsecureProtocol = true
        }
        google()
    }
    dependencies {
        classpath 'org.teavm:teavm-gradle-plugin:0.14.0'
        classpath 'org.gretty:gretty:4.1.10'
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "nes_emu"
        gdxVersion = '1.14.0'
        gdxTeaVMVersion = '1.5.6'
        roboVMVersion = '2.3.20'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.1'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
}

project(":desktop") {
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    // libGDX 1.14.0 ships LWJGL 3.3.3 transitively; JDK 25 requires LWJGL
    // 3.4.0+ (libGDX docs). Force every org.lwjgl artifact to 3.4.1 so the
    // transitive natives and FFM-backed system module line up.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion('3.4.1')
            }
        }
    }

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        api "org.lwjgl:lwjgl-tinyfd:3.4.1"
        api "org.lwjgl:lwjgl-tinyfd:3.4.1:natives-windows"
        api "org.lwjgl:lwjgl-tinyfd:3.4.1:natives-linux"
        api "org.lwjgl:lwjgl-tinyfd:3.4.1:natives-macos"

        testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        // Harness fixtures tier (docs/headless-harness-plan.md A0) — shared
        // headless-harness helpers from core's java-test-fixtures source set.
        testImplementation testFixtures(project(":core"))
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    }

    sourceSets {
        test {
            java.srcDirs = ["test/"]
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed", "standardOut", "standardError"
            showStandardStreams = true
            exceptionFormat = "full"
        }
        afterSuite { desc, result ->
            if (desc.parent == null) {
                logger.lifecycle("\nTest results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
            }
        }
    }
}


project(":core") {
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        compileOnly 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.projectlombok:lombok:1.18.42'
        implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
        implementation 'org.apache.logging.log4j:log4j-core:2.23.1'



        testCompileOnly 'org.projectlombok:lombok:1.18.42'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"

    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed", "standardOut", "standardError"
            showStandardStreams = true
            exceptionFormat = "full"
        }
        afterSuite { desc, result ->
            if (desc.parent == null) {
                logger.lifecycle("\nTest results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
            }
        }
    }
}

project(":html") {
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    dependencies {
        implementation project(":core")
        implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
        implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
        
        // Exclude Log4j from web build - TeaVM doesn't support all Java Time APIs
        configurations.all {
            exclude group: 'org.apache.logging.log4j'
        }
    }
}
