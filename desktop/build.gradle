sourceCompatibility = 1.8
sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "net.lomibao.nes.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

import org.gradle.internal.os.OperatingSystem

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        // Required to run on macOS
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('debug', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

// Task to view CHR ROM tiles from nestest.nes using PixelRenderer
tasks.register('viewCHRTiles', JavaExec) {
    group = 'debugging'
    description = 'Displays tiles from nestest.nes ROM using PixelRenderer'
    
    dependsOn classes
    mainClass = 'net.lomibao.nes.desktop.CHRTileViewerLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    
    // Optional: pass ROM path as argument
    // args = ['nestest.nes']
    
    jvmArgs = ['-Xmx512m']
}

// Task to run nestest.nes with background rendering
tasks.register('runNestest', JavaExec) {
    group = 'emulator'
    description = 'Runs nestest.nes ROM and renders the background using PPU'
    
    dependsOn classes
    mainClass = 'net.lomibao.nes.desktop.NestestBackgroundLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    
    jvmArgs = ['-Xmx1024m']
    
    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        jvmArgs += "-XstartOnFirstThread"
    }
}

// Step 8: launch an arbitrary NES ROM via RomLauncher.
//   ./gradlew desktop:runRom -Prom=path/to/file.nes
// Falls back to nestest.nes if -Prom isn't supplied.
tasks.register('runRom', JavaExec) {
    group = 'emulator'
    description = 'Runs an arbitrary NES ROM via RomLauncher (use -Prom=path)'

    dependsOn classes
    mainClass = 'net.lomibao.nes.desktop.RomLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    jvmArgs = ['-Xmx1024m']

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        jvmArgs += "-XstartOnFirstThread"
    }

    if (project.hasProperty('rom')) {
        args = [project.property('rom')]
    }
}

tasks.register('dist', Jar) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}


dist.dependsOn classes

eclipse.project.name = appName + "-desktop"
